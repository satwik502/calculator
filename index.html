<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Calculator</title>
  <style>
    /* Reset & Page Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #eef2f7;
    }

    /* Calculator Container */
    .calculator {
      background: #ffffff;
      width: 320px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    /* Display Screen */
    .display {
      width: 100%;
      height: 70px;
      background: #f4f6f9;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 2rem;
      text-align: right;
      color: #2d3748;
      outline: none;
      margin-bottom: 20px;
    }

    /* Buttons Grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* Button Styling */
    button {
      height: 56px;
      font-size: 1.25rem;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      background: #edf2f7;
      color: #2d3748;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #e2e8f0;
    }

    button:active {
      transform: scale(0.96);
    }

    /* Special Buttons */
    .operator {
      background: #feebc8;
      color: #dd6b20;
    }

    .operator:hover {
      background: #fbd38d;
    }

    .clear {
      background: #fed7d7;
      color: #e53e3e;
    }

    .clear:hover {
      background: #feb2b2;
    }

    .equal {
      background: #48bb78;
      color: #ffffff;
      grid-column: span 2;
    }

    .equal:hover {
      background: #38a169;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Screen Display -->
    <input type="text" id="display" class="display" readonly placeholder="0" />

    <!-- Calculator Buttons -->
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="clear" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('00')">00</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    // Add character to display
    function appendValue(val) {
      display.value += val;
    }

    // Clear everything
    function clearDisplay() {
      display.value = '';
    }

    // Delete single character
    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    // Evaluate expression
    function calculate() {
      try {
        if (display.value.trim() !== '') {
          // Evaluates arithmetic operations safely for basic math
          display.value = Function('"use strict";return (' + display.value + ')')();
        }
      } catch (err) {
        display.value = 'Error';
      }
    }
  </script>

</body>
</html>
